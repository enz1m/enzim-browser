<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Browser</title>
  <defs>
    <filter id="enz-browser-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="enz-browser-earth">
      <circle cx="64" cy="64" r="44"/>
    </clipPath>
  </defs>

  <!-- circle keyline; earth r 44 on (64 64) (20..108); flat continents clipped to the disc;
       pointer tip at (66 58), fully inside the disc -->
  <g filter="url(#enz-browser-drop)">
    <circle cx="64" cy="64" r="44" fill="#4A5BE0"/>
    <g clip-path="url(#enz-browser-earth)" fill="#5FD49A">
      <path d="M22 30 C34 22 50 24 54 34 C57 42 48 46 46 54 C44 62 52 68 50 80 C48 92 38 98 32 92 C26 84 30 74 24 66 C18 58 12 38 22 30 Z"/>
      <path d="M72 24 C84 20 98 26 104 38 C98 44 88 40 84 46 C90 52 98 58 96 72 C94 84 84 92 78 84 C74 76 78 66 70 60 C64 54 64 30 72 24 Z"/>
      <path d="M86 92 C94 88 104 90 106 98 C100 106 88 106 84 100 C82 96 83 94 86 92 Z"/>
    </g>
  </g>
  <path d="M66 58 V88 L73 81.5 L78.5 93 L84.5 90.3 L79 79 L88.5 78.5 Z" fill="#FFFFFF" stroke="#2B3140" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
