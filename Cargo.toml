[package]
name = "enzim-browser"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native Linux web browser built with enzUI and Rust WPE WebKit"

[build-dependencies]
sha2 = "0.10"
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking", "embedded-domain-resolver"] }
serde_json = "1"

[features]
default = ["wpe", "center"]
# The browser as an app of the enzUI agent center: agents list, open, read and
# work its pages through the center, which asks the person first. It connects
# only when the center gave the browser a credential.
center = ["dep:enzui-agent"]
# Native WPE is enabled in the normal browser build.
wpe = ["enzui-webview/wpe"]
benchmark = ["wpe", "enzui-webview/diagnostics"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
curl = "0.4.51"
roxmltree = "0.20"
url = "2"
tree_magic_mini = "=3.2.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
iced = { workspace = true, features = ["x11", "wayland", "image-without-codecs"] }
iced_renderer = { git = "https://github.com/enz1m/enzim-iced.git", rev = "838066d2e7373e87cfb42e62cca5a1dc9625b5f9", default-features = false, features = ["fira-sans"] }
enzui-core = { workspace = true, features = ["accesskit", "portal-dbus", "notification-freedesktop", "activation-native-iced", "desktop-font-portal"] }
enzui-security = { workspace = true }
enzui-activity = { workspace = true }
enzui-clipboard-runtime = { workspace = true }
enzui-services = { workspace = true, features = ["secret-service"] }
enzui-theme.workspace = true
# portal-dbus: file choosers go through the desktop portal; the in-app one
# remains for hosts without it.
enzui-widgets = { workspace = true, features = ["application-dbus", "portal-dbus"] }
enzui-webview.workspace = true
enzui-webkit.workspace = true
enzui-agent = { workspace = true, optional = true, features = ["iced-consumer"] }
rusqlite = { version = "0.31.0", features = ["hooks", "limits"] }
chrono = { version = "0.4", features = ["clock"] }
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking", "embedded-domain-resolver"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
zeroize = "1.9"
hmac = "0.12.1"
sha1 = "0.10.7"
csv-core = "0.1.13"
getrandom = "0.3"
data-encoding = "2.11"
rustix = { version = "1.1", features = ["process", "fs", "pipe"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
psl = "2"
# The appearance file's own table beside the theme tokens.
toml_edit = "0.25"
# Blur behind a glass window frame: the window's own connection and the two
# protocols that ask a compositor for it. All are in the graph through winit.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[dev-dependencies]
enzui-security = { workspace = true, features = ["secret-observer"] }
# The scratch-directory cleanup tests arm the shared fault injector.
enzui-core = { workspace = true, features = ["security-fault-injection"] }
iced_test.workspace = true

[lints]
workspace = true


[workspace]
resolver = "3"
members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
return_self_not_must_use = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
trivially_copy_pass_by_ref = "warn"
large_stack_arrays = "warn"
ref_option = "warn"
implicit_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"
cast_lossless = "warn"
significant_drop_in_scrutinee = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
explicit_iter_loop = "warn"
ignored_unit_patterns = "warn"
unused_async = "warn"
string_slice = "warn"
unwrap_in_result = "warn"
panic = "warn"
iter_over_hash_type = "warn"
allow_attributes_without_reason = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_assert_message = "warn"
str_to_string = "warn"
format_push_string = "warn"
redundant_type_annotations = "warn"

[workspace.dependencies]
enzui-webkit = { git = "https://github.com/enz1m/enzim-webkit-rs.git", rev = "d82ca615d09dcdb078968eac261680109ced09f0" }
enzui-webview = { git = "https://github.com/enz1m/enzim-webkit-rs.git", rev = "d82ca615d09dcdb078968eac261680109ced09f0" }
enzui-security = { git = "https://github.com/enz1m/enzui.git", rev = "4f951251c8f31a649dd862e274f81260690a9b98" }
enzui-activity = { git = "https://github.com/enz1m/enzui.git", rev = "4f951251c8f31a649dd862e274f81260690a9b98", default-features = false }
enzui-clipboard-runtime = { git = "https://github.com/enz1m/enzui.git", rev = "4f951251c8f31a649dd862e274f81260690a9b98", default-features = false }
enzui-services = { git = "https://github.com/enz1m/enzui.git", rev = "4f951251c8f31a649dd862e274f81260690a9b98" }
enzui-core = { git = "https://github.com/enz1m/enzui.git", rev = "4f951251c8f31a649dd862e274f81260690a9b98" }
enzui-theme = { git = "https://github.com/enz1m/enzui.git", rev = "4f951251c8f31a649dd862e274f81260690a9b98" }
enzui-widgets = { git = "https://github.com/enz1m/enzui.git", rev = "4f951251c8f31a649dd862e274f81260690a9b98" }
enzui-external-image = { git = "https://github.com/enz1m/enzui.git", rev = "4f951251c8f31a649dd862e274f81260690a9b98" }
enzui-agent = { git = "https://github.com/enz1m/enzui.git", rev = "4f951251c8f31a649dd862e274f81260690a9b98" }
iced = { git = "https://github.com/enz1m/enzim-iced.git", rev = "838066d2e7373e87cfb42e62cca5a1dc9625b5f9", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "tokio",
    "linux-theme-detection",
    "canvas",
    "svg",
    "a11y",
] }
iced_test = { git = "https://github.com/enz1m/enzim-iced.git", rev = "838066d2e7373e87cfb42e62cca5a1dc9625b5f9" }

# Use the same optimization level for the browser and its dependencies.
[profile.dev]
opt-level = 2
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

# Omit widget debug information to stay within the compiler memory ceiling.
[profile.dev.package.enzui-widgets]
debug = 0

[patch.crates-io]
winit = { git = "https://github.com/enz1m/enzim-winit.git", rev = "405e1caca89357f6da20eafe7ed8abc686567092" }
zbus = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus_macros = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus_names = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_derive = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_utils = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
