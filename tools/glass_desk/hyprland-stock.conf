# Hyprland as its example config sets decoration up: for checking the glass frame on a stock setup.
monitor=,1440x880@60,0x0,1
general {
    gaps_in = 5
    gaps_out = 30
    border_size = 0
}
decoration {
    rounding = 10
    shadow {
        enabled = true
        range = 4
        render_power = 3
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}
animations {
    enabled = false
}
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
# Give it something to blur: exec-once = swaybg -m fill -i /path/to/a/picture.png
